[project]
name = "langfuse-evaluators"
version = "0.1.0"
description = "Create and manage Langfuse evaluators (LLM-as-Judge + Code) via the v2 API"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
create-evaluators = "langfuse_evaluators.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langfuse_evaluators"]
